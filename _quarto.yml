project:
  type: book
  output-dir: _site
  resources:
    - datos/      # los datasets se publican junto a la web

lang: es

license: "CC BY-SA 4.0"
copyright:
  holder: Claudio M. Martínez Velasco
  year: 2026

filters:
  - tema/terminal.lua    # colorea los bloques ```terminal en la web
  - tema/soluciones.lua  # en PDF, soluciones al final del capítulo

book:
  title: "Bendito maldito Linux"
  subtitle: "Trabajar en Linux y conceptos de redes, explicado tan fácil que hasta un físico lo puede entender"
  author: "Claudio M. Martínez Velasco"
  date: 2026-08-01
  date-format: "MMMM [de] YYYY"   # se muestra como «agosto de 2026»
  # El botón de descarga del PDF sale de aquí. Desactivado durante la
  # redacción («deja el PDF para cuando acabemos»); reactivar al final:
  # downloads: [pdf]
  page-footer:
    center: "© 2026 Claudio M. Martínez Velasco · Texto bajo licencia CC BY-SA 4.0"
  chapters:
    - index.qmd
    - capitulos/cap01.qmd
    - capitulos/cap02.qmd
    - capitulos/cap03.qmd
    - capitulos/cap04.qmd
    - capitulos/cap05.qmd
    - capitulos/cap06.qmd
    - capitulos/cap07.qmd
    - capitulos/cap08.qmd
    - capitulos/cap09.qmd
    - capitulos/cap10.qmd
    - capitulos/cap11.qmd
    - capitulos/cap12.qmd
    - capitulos/proyecto-final.qmd
  appendices:
    - anexos/anexo-windows.qmd
    - anexos/anexo-c1-pc-real.qmd
    - anexos/anexo-b1-scripting.qmd
    - anexos/anexo-b2-montajes.qmd
    - anexos/anexo-e1-ia.qmd
    - anexos/anexo-e2-slurm.qmd

format:
  html:
    theme:
      - cosmo
      - tema/curso.scss
    # Resaltado de sintaxis pensado para fondo oscuro (solo web;
    # el PDF mantiene el tema claro por defecto)
    highlight-style: monokai
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: false        # regla del curso: no copies, teclea
    fontsize: 16.5px
  # PDF desactivado durante la redacción; reactivar al terminar el curso
  # (pendiente entonces: colorear los bloques de terminal en tema claro).
  # Para probarlo en local basta descomentar y `quarto render --to pdf`.
  # pdf:
  #   documentclass: scrreprt
  #   papersize: a4
  #   toc: true
  #   number-sections: true
  #   colorlinks: true
  #   # Fondo gris de los bloques de terminal (los usa tema/terminal.lua):
  #   include-in-header:
  #     text: |
  #       \usepackage{framed}
  #       \usepackage{fancyvrb}
  #       \definecolor{shadecolor}{RGB}{240,237,230}

execute:
  freeze: auto
