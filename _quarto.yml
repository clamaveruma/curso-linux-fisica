project:
  type: book
  output-dir: _site
  resources:
    - datos/      # los datasets se publican junto a la web

lang: es

license: "CC BY-SA 4.0"
copyright:
  holder: Claudio M. Martínez Velasco
  year: 2026

filters:
  - tema/terminal.lua    # colorea los bloques ```terminal en la web
  - tema/soluciones.lua  # en PDF, soluciones al final del capítulo

book:
  title: "Bendito maldito Linux"
  subtitle: "Trabajar en Linux y conceptos de redes, explicado tan «fácil» que hasta un físico lo puede entender"
  author: "Claudio M. Martínez Velasco"
  cover-image: portada/portada-web.png
  cover-image-alt: "Portada: un pingüino con bata de laboratorio ante una pizarra con la ecuación de Schrödinger, un osciloscopio y un teletipo"
  date: 2026-08-01
  date-format: "MMMM [de] YYYY"   # se muestra como «agosto de 2026»
  # El botón de descarga del PDF sale de aquí. Desactivado durante la
  # redacción («deja el PDF para cuando acabemos»); reactivar al final:
  downloads: [pdf]
  page-footer:
    center: "Bendito maldito Linux · versión agosto 2026 · © 2026 Claudio M. Martínez Velasco · CC BY-SA 4.0"
  chapters:
    - index.qmd
    - capitulos/cap01.qmd
    - capitulos/cap02.qmd
    - capitulos/cap03.qmd
    - capitulos/cap04.qmd
    - capitulos/cap05.qmd
    - capitulos/cap06.qmd
    - capitulos/cap07.qmd
    - capitulos/cap08.qmd
    - capitulos/cap09.qmd
    - capitulos/cap10.qmd
    - capitulos/cap11.qmd
    - capitulos/cap12.qmd
    - capitulos/cap13.qmd
    - capitulos/proyecto-final.qmd
  appendices:
    - anexos/anexo-windows.qmd
    - anexos/anexo-c1-pc-real.qmd
    - anexos/anexo-b1-scripting.qmd
    - anexos/anexo-b2-montajes.qmd
    - anexos/anexo-e1-ia.qmd

format:
  html:
    theme:
      - cosmo
      - tema/curso.scss
    # Resaltado de sintaxis pensado para fondo oscuro (solo web;
    # el PDF mantiene el tema claro por defecto)
    highlight-style: monokai
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: false        # regla del curso: no copies, teclea
    fontsize: 16.5px
  pdf:
    documentclass: scrreprt
    papersize: a4
    toc: true
    number-sections: true
    colorlinks: true
    include-in-header:
      text: |
        \usepackage{framed}
        \usepackage{fancyvrb}
        \usepackage{eso-pic}
        % caja y colores de los bloques de terminal (tema/terminal.lua)
        \definecolor{shadecolor}{HTML}{F1EDE4}
        \definecolor{tprompt}{HTML}{2F6F62}
        \definecolor{tpath}{HTML}{9A6A14}
        \definecolor{tdim}{HTML}{8A7A5A}
        \definecolor{tout}{HTML}{5A4D3A}
        % portada gráfica como primera página, antes de la portada tipográfica
        \AtBeginDocument{%
          \begin{titlepage}\thispagestyle{empty}%
          \AddToShipoutPictureBG*{\put(0,0){\includegraphics[width=\paperwidth,height=\paperheight]{portada/portada.png}}}%
          \null\end{titlepage}\clearpage}

execute:
  freeze: auto
