<svg viewBox="0 0 700 200" width="700" height="200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Las teclas del visor de man: moverse, buscar, siguiente y salir">
  <g font-family="IBM Plex Mono,monospace">
    <rect x="30" y="20" width="640" height="110" rx="6" fill="#0E1512"/>
    <text x="48" y="44" font-size="11" fill="#6BD6BC" font-weight="600">LS(1)                    Órdenes de usuario                    LS(1)</text>
    <text x="48" y="66" font-size="10.5" fill="#D8E6E0">NOMBRE</text>
    <text x="48" y="82" font-size="10.5" fill="#9FB4AC">       ls - lista el contenido de un directorio</text>
    <text x="48" y="104" font-size="10.5" fill="#D8E6E0">SINOPSIS</text>
    <text x="48" y="120" font-size="10.5" fill="#9FB4AC">       ls [OPCIÓN]... [FICHERO]...</text>
    <!-- teclas -->
    <g font-size="10.5" fill="#6A5F4D">
      <rect x="40" y="150" width="130" height="34" rx="3" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1"/>
      <text x="105" y="165" text-anchor="middle" font-weight="600" fill="#2B2318">↑ ↓  Espacio</text>
      <text x="105" y="179" text-anchor="middle" font-size="9.5">moverse por la página</text>
      <rect x="195" y="150" width="130" height="34" rx="3" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.2"/>
      <text x="260" y="165" text-anchor="middle" font-weight="600" fill="#24564B">/ palabra  Intro</text>
      <text x="260" y="179" text-anchor="middle" font-size="9.5">buscar dentro</text>
      <rect x="350" y="150" width="130" height="34" rx="3" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.2"/>
      <text x="415" y="165" text-anchor="middle" font-weight="600" fill="#24564B">n</text>
      <text x="415" y="179" text-anchor="middle" font-size="9.5">siguiente aparición</text>
      <rect x="505" y="150" width="130" height="34" rx="3" fill="#F5DED6" stroke="#C4342A" stroke-width="1.2"/>
      <text x="570" y="165" text-anchor="middle" font-weight="600" fill="#C4342A">q</text>
      <text x="570" y="179" text-anchor="middle" font-size="9.5">salir</text>
    </g>
  </g>
</svg>
