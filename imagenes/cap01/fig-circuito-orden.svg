<svg viewBox="0 0 700 200" width="700" height="200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="El circuito de una orden: tú, terminal, shell, programa">
  <defs>
    <marker id="fte" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6A5F4D"/>
    </marker>
    <marker id="ftv" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#2F6F62"/>
    </marker>
  </defs>
  <g font-family="IBM Plex Mono,monospace">
    <!-- tú -->
    <circle cx="70" cy="78" r="13" fill="none" stroke="#2B2318" stroke-width="1.8"/>
    <path d="M48 118 q22 -22 44 0" fill="none" stroke="#2B2318" stroke-width="1.8"/>
    <text x="70" y="140" font-size="12.5" fill="#2B2318" text-anchor="middle" font-weight="600">tú</text>
    <!-- terminal -->
    <rect x="150" y="55" width="140" height="66" rx="4" fill="#F5EBD6" stroke="#9A6A14" stroke-width="1.5"/>
    <text x="220" y="80" font-size="13" fill="#9A6A14" text-anchor="middle" font-weight="600">TERMINAL</text>
    <text x="220" y="98" font-size="10.5" fill="#6A5F4D" text-anchor="middle">la ventana:</text>
    <text x="220" y="111" font-size="10.5" fill="#6A5F4D" text-anchor="middle">dibuja texto</text>
    <text x="220" y="140" font-size="10" fill="#9C8F79" text-anchor="middle">no entiende nada</text>
    <!-- shell -->
    <rect x="360" y="55" width="140" height="66" rx="4" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.5"/>
    <text x="430" y="80" font-size="13" fill="#24564B" text-anchor="middle" font-weight="600">SHELL (bash)</text>
    <text x="430" y="98" font-size="10.5" fill="#6A5F4D" text-anchor="middle">interpreta la orden</text>
    <text x="430" y="111" font-size="10.5" fill="#6A5F4D" text-anchor="middle">y la pone en marcha</text>
    <text x="430" y="140" font-size="10" fill="#9C8F79" text-anchor="middle">el que te escucha</text>
    <!-- programa -->
    <rect x="570" y="55" width="100" height="66" rx="4" fill="#0E1512"/>
    <text x="620" y="83" font-size="14" fill="#6BD6BC" text-anchor="middle" font-weight="600">ls</text>
    <text x="620" y="101" font-size="10.5" fill="#D8E6E0" text-anchor="middle">el programa:</text>
    <text x="620" y="114" font-size="10.5" fill="#D8E6E0" text-anchor="middle">hace el trabajo</text>
    <!-- flechas de ida (arriba) -->
    <line x1="92" y1="70" x2="144" y2="70" stroke="#6A5F4D" stroke-width="1.5" marker-end="url(#fte)"/>
    <text x="118" y="60" font-size="10" fill="#6A5F4D" text-anchor="middle">teclas</text>
    <line x1="290" y1="70" x2="354" y2="70" stroke="#6A5F4D" stroke-width="1.5" marker-end="url(#fte)"/>
    <text x="322" y="60" font-size="10" fill="#6A5F4D" text-anchor="middle">«ls -lh»</text>
    <line x1="500" y1="70" x2="564" y2="70" stroke="#6A5F4D" stroke-width="1.5" marker-end="url(#fte)"/>
    <text x="532" y="60" font-size="10" fill="#6A5F4D" text-anchor="middle">ejecuta</text>
    <!-- flechas de vuelta (abajo) -->
    <line x1="564" y1="108" x2="500" y2="108" stroke="#2F6F62" stroke-width="1.5" marker-end="url(#ftv)"/>
    <line x1="354" y1="108" x2="290" y2="108" stroke="#2F6F62" stroke-width="1.5" marker-end="url(#ftv)"/>
    <line x1="144" y1="108" x2="97" y2="108" stroke="#2F6F62" stroke-width="1.5" marker-end="url(#ftv)"/>
    <text x="322" y="126" font-size="10" fill="#2F6F62" text-anchor="middle">resultado</text>
    <text x="532" y="126" font-size="10" fill="#2F6F62" text-anchor="middle">texto</text>
    <text x="350" y="176" font-size="11" fill="#6A5F4D" text-anchor="middle">escribes → el shell entiende → el programa trabaja → el texto vuelve a tu pantalla</text>
  </g>
</svg>
