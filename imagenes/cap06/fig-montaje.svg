<svg viewBox="0 0 700 300" width="700" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Los discos se enganchan al árbol único mediante puntos de montaje">
  <defs>
    <marker id="fmo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2F6F62"/></marker>
  </defs>
  <g font-family="IBM Plex Mono,monospace">
    <!-- arbol -->
    <text x="60" y="42" fill="#C4342A" font-weight="600" font-size="16">/</text>
    <text x="90" y="42" fill="#9C8F79" font-size="10.5">el árbol único del capítulo 1</text>
    <line x1="66" y1="52" x2="66" y2="252" stroke="#C9B995" stroke-width="1.5"/>
    <line x1="66" y1="80" x2="95" y2="80" stroke="#C9B995" stroke-width="1.5"/>
    <text x="103" y="85" fill="#6A5F4D" font-size="13">home/</text>
    <line x1="66" y1="130" x2="95" y2="130" stroke="#C9B995" stroke-width="1.5"/>
    <text x="103" y="135" fill="#6A5F4D" font-size="13">boot/</text>
    <line x1="150" y1="135" x2="150" y2="158" stroke="#C9B995" stroke-width="1.2"/>
    <line x1="150" y1="158" x2="172" y2="158" stroke="#C9B995" stroke-width="1.2"/>
    <text x="180" y="163" fill="#2B2318" font-size="13" font-weight="600">efi/</text>
    <line x1="66" y1="205" x2="95" y2="205" stroke="#C9B995" stroke-width="1.5"/>
    <text x="103" y="210" fill="#6A5F4D" font-size="13">media/</text>
    <line x1="150" y1="210" x2="150" y2="233" stroke="#C9B995" stroke-width="1.2"/>
    <line x1="150" y1="233" x2="172" y2="233" stroke="#C9B995" stroke-width="1.2"/>
    <text x="180" y="238" fill="#2B2318" font-size="13" font-weight="600">marcos/PRACTICAS/</text>
    <!-- discos a la derecha -->
    <rect x="470" y="28" width="200" height="42" rx="4" fill="#0E1512"/>
    <text x="570" y="46" font-size="11.5" fill="#6BD6BC" text-anchor="middle" font-weight="600">nvme0n1p2 · ext4</text>
    <text x="570" y="61" font-size="9.5" fill="#D8E6E0" text-anchor="middle">tu disco interno: el sistema</text>
    <rect x="470" y="118" width="200" height="42" rx="4" fill="#F5EBD6" stroke="#9A6A14" stroke-width="1.4"/>
    <text x="570" y="136" font-size="11.5" fill="#9A6A14" text-anchor="middle" font-weight="600">nvme0n1p1 · FAT32</text>
    <text x="570" y="151" font-size="9.5" fill="#6A5F4D" text-anchor="middle">la partición EFI (arranque)</text>
    <rect x="470" y="193" width="200" height="42" rx="4" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.4"/>
    <text x="570" y="211" font-size="11.5" fill="#24564B" text-anchor="middle" font-weight="600">sda1 · exFAT</text>
    <text x="570" y="226" font-size="9.5" fill="#6A5F4D" text-anchor="middle">tu pendrive</text>
    <!-- flechas de montaje -->
    <line x1="463" y1="49" x2="90" y2="42" stroke="#2F6F62" stroke-width="1.6" marker-end="url(#fmo)"/>
    <text x="300" y="30" font-size="10" fill="#2F6F62" text-anchor="middle">montado en /</text>
    <line x1="463" y1="139" x2="215" y2="160" stroke="#2F6F62" stroke-width="1.6" marker-end="url(#fmo)"/>
    <text x="345" y="140" font-size="10" fill="#2F6F62" text-anchor="middle">montado en /boot/efi</text>
    <line x1="463" y1="214" x2="345" y2="235" stroke="#2F6F62" stroke-width="1.6" marker-end="url(#fmo)"/>
    <text x="415" y="222" font-size="10" fill="#2F6F62" text-anchor="middle">montado en /media/…</text>
    <text x="350" y="280" font-size="10.5" fill="#6A5F4D" text-anchor="middle">no hay «unidades C: y D:»: cada disco se engancha en una rama — el punto de montaje — y desaparece como cosa aparte</text>
  </g>
</svg>
