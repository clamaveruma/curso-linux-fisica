<svg viewBox="0 0 700 280" width="700" height="280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="El ciclo de apt: repositorio, catálogo local y sistema">
  <defs>
    <marker id="fau" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2F6F62"/></marker>
    <marker id="fai" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#C4342A"/></marker>
    <marker id="fag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#9A6A14"/></marker>
  </defs>
  <g font-family="IBM Plex Mono,monospace">
    <!-- repositorio -->
    <ellipse cx="120" cy="52" rx="90" ry="14" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.4"/>
    <path d="M30 52 v70 a90 14 0 0 0 180 0 v-70" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.4"/>
    <ellipse cx="120" cy="122" rx="90" ry="14" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.4"/>
    <text x="120" y="80" font-size="12.5" fill="#24564B" text-anchor="middle" font-weight="600">REPOSITORIO</text>
    <text x="120" y="98" font-size="10" fill="#6A5F4D" text-anchor="middle">~60 000 paquetes</text>
    <text x="120" y="112" font-size="10" fill="#6A5F4D" text-anchor="middle">en internet</text>
    <!-- catalogo -->
    <rect x="290" y="45" width="150" height="85" rx="4" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.3"/>
    <text x="365" y="70" font-size="12.5" fill="#2B2318" text-anchor="middle" font-weight="600">CATÁLOGO LOCAL</text>
    <text x="365" y="90" font-size="10" fill="#6A5F4D" text-anchor="middle">la lista de lo que existe,</text>
    <text x="365" y="104" font-size="10" fill="#6A5F4D" text-anchor="middle">con versiones</text>
    <!-- sistema -->
    <rect x="520" y="45" width="150" height="85" rx="4" fill="#F5EBD6" stroke="#9A6A14" stroke-width="1.4"/>
    <text x="595" y="70" font-size="12.5" fill="#9A6A14" text-anchor="middle" font-weight="600">TU SISTEMA</text>
    <text x="595" y="90" font-size="10" fill="#6A5F4D" text-anchor="middle">lo instalado,</text>
    <text x="595" y="104" font-size="10" fill="#6A5F4D" text-anchor="middle">con sus versiones</text>
    <!-- update -->
    <line x1="213" y1="87" x2="283" y2="87" stroke="#2F6F62" stroke-width="1.8" marker-end="url(#fau)"/>
    <text x="248" y="76" font-size="10.5" fill="#2F6F62" text-anchor="middle" font-weight="600">apt update</text>
    <text x="248" y="150" font-size="9.5" fill="#6A5F4D" text-anchor="middle">refresca la LISTA</text>
    <text x="248" y="163" font-size="9.5" fill="#9C8F79" text-anchor="middle">(no instala nada)</text>
    <!-- install -->
    <path d="M120 140 C 150 215, 480 215, 583 140" fill="none" stroke="#C4342A" stroke-width="1.8" marker-end="url(#fai)"/>
    <text x="350" y="212" font-size="10.5" fill="#C4342A" text-anchor="middle" font-weight="600">apt install tree</text>
    <text x="350" y="228" font-size="9.5" fill="#6A5F4D" text-anchor="middle">trae el paquete y sus dependencias, y lo configura</text>
    <!-- upgrade -->
    <line x1="443" y1="87" x2="513" y2="87" stroke="#9A6A14" stroke-width="1.8" marker-end="url(#fag)"/>
    <text x="478" y="76" font-size="10.5" fill="#9A6A14" text-anchor="middle" font-weight="600">apt upgrade</text>
    <text x="478" y="150" font-size="9.5" fill="#6A5F4D" text-anchor="middle">compara e instala</text>
    <text x="478" y="163" font-size="9.5" fill="#9C8F79" text-anchor="middle">las versiones nuevas</text>
    <text x="350" y="262" font-size="10.5" fill="#9C8F79" text-anchor="middle">por eso van en pareja: update pone al día el mapa · upgrade actualiza el territorio</text>
  </g>
</svg>
