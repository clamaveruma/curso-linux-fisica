<svg viewBox="0 0 700 270" width="700" height="270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Los dos caminos de la misma ISO: a la máquina virtual y a un pendrive para un PC real">
  <defs>
    <marker id="fdc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6A5F4D"/></marker>
  </defs>
  <g font-family="IBM Plex Mono,monospace">
    <!-- ISO -->
    <circle cx="110" cy="130" r="48" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.5"/>
    <circle cx="110" cy="130" r="12" fill="#F2ECDF" stroke="#9C8F79" stroke-width="1.2"/>
    <text x="110" y="205" font-size="11" fill="#2B2318" text-anchor="middle" font-weight="600">debian-13.x-netinst.iso</text>
    <text x="110" y="220" font-size="9.5" fill="#9C8F79" text-anchor="middle">la imagen del CD, verificada</text>
    <!-- camino VM -->
    <path d="M160 110 C 230 60, 300 60, 370 70" fill="none" stroke="#6A5F4D" stroke-width="1.8" marker-end="url(#fdc)"/>
    <text x="265" y="52" font-size="10" fill="#2F6F62" text-anchor="middle" font-weight="600">se «inserta» tal cual</text>
    <rect x="380" y="40" width="290" height="62" rx="5" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.5"/>
    <text x="525" y="64" font-size="12" fill="#24564B" text-anchor="middle" font-weight="600">la máquina virtual · este capítulo</text>
    <text x="525" y="84" font-size="9.5" fill="#6A5F4D" text-anchor="middle">romper y reinstalar hasta que aburra</text>
    <!-- camino USB -->
    <path d="M160 150 C 230 200, 260 200, 300 200" fill="none" stroke="#6A5F4D" stroke-width="1.8" marker-end="url(#fdc)"/>
    <rect x="308" y="182" width="86" height="36" rx="4" fill="#F5EBD6" stroke="#9A6A14" stroke-width="1.4"/>
    <text x="351" y="204" font-size="10.5" fill="#9A6A14" text-anchor="middle" font-weight="600">pendrive</text>
    <text x="351" y="240" font-size="9" fill="#9C8F79" text-anchor="middle">grabado byte a byte</text>
    <path d="M398 200 h60" fill="none" stroke="#6A5F4D" stroke-width="1.8" marker-end="url(#fdc)"/>
    <rect x="466" y="168" width="204" height="62" rx="5" fill="#FAF6EB" stroke="#C4342A" stroke-width="1.5"/>
    <text x="568" y="192" font-size="12" fill="#C4342A" text-anchor="middle" font-weight="600">un PC de verdad · anexo C1</text>
    <text x="568" y="212" font-size="9.5" fill="#6A5F4D" text-anchor="middle">mismo instalador, mismas decisiones</text>
    <text x="350" y="140" font-size="10" fill="#9C8F79" text-anchor="middle">lo que ensayas arriba es, paso a paso, lo que harás abajo</text>
  </g>
</svg>
