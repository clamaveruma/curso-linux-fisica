<svg viewBox="0 0 700 300" width="700" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Una conexión TCP la identifican cuatro números: dirección y puerto de cada extremo">
  <defs>
    <marker id="fct" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2F6F62"/></marker>
  </defs>
  <g font-family="IBM Plex Mono,monospace">
    <!-- cliente -->
    <rect x="25" y="40" width="210" height="200" rx="6" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.4"/>
    <text x="130" y="64" font-size="11" fill="#2B2318" text-anchor="middle" font-weight="600">tu Mint · 192.168.122.1</text>
    <rect x="42" y="80" width="176" height="40" rx="3" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.2"/>
    <text x="130" y="97" font-size="9.5" fill="#24564B" text-anchor="middle" font-weight="600">terminal 1: ssh lab</text>
    <text x="130" y="112" font-size="9" fill="#6A5F4D" text-anchor="middle">puerto efímero 51234</text>
    <rect x="42" y="130" width="176" height="40" rx="3" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.2"/>
    <text x="130" y="147" font-size="9.5" fill="#24564B" text-anchor="middle" font-weight="600">terminal 2: scp …</text>
    <text x="130" y="162" font-size="9" fill="#6A5F4D" text-anchor="middle">puerto efímero 51240</text>
    <text x="130" y="200" font-size="8.5" fill="#9C8F79" text-anchor="middle">el cliente elige un puerto</text>
    <text x="130" y="213" font-size="8.5" fill="#9C8F79" text-anchor="middle">libre y alto para cada conexión</text>
    <!-- servidor -->
    <rect x="465" y="40" width="210" height="200" rx="6" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.4"/>
    <text x="570" y="64" font-size="11" fill="#2B2318" text-anchor="middle" font-weight="600">debian-lab · 192.168.122.15</text>
    <rect x="482" y="95" width="176" height="60" rx="3" fill="#0E1512"/>
    <text x="570" y="118" font-size="10.5" fill="#6BD6BC" text-anchor="middle" font-weight="600">sshd escucha en el 22</text>
    <text x="570" y="136" font-size="8.5" fill="#D8E6E0" text-anchor="middle">un puerto, muchas conversaciones</text>
    <text x="570" y="148" font-size="8.5" fill="#D8E6E0" text-anchor="middle">a la vez, sin mezclarlas</text>
    <text x="570" y="200" font-size="8.5" fill="#9C8F79" text-anchor="middle">puertos &lt; 1024: solo root puede</text>
    <text x="570" y="213" font-size="8.5" fill="#9C8F79" text-anchor="middle">escuchar en ellos (cap. 4)</text>
    <!-- conexiones -->
    <line x1="220" y1="100" x2="478" y2="118" stroke="#2F6F62" stroke-width="1.8" marker-end="url(#fct)"/>
    <line x1="220" y1="150" x2="478" y2="132" stroke="#2F6F62" stroke-width="1.8" marker-end="url(#fct)"/>
    <text x="350" y="92" font-size="8.5" fill="#2F6F62" text-anchor="middle">(192.168.122.1, 51234, 192.168.122.15, 22)</text>
    <text x="350" y="160" font-size="8.5" fill="#2F6F62" text-anchor="middle">(192.168.122.1, 51240, 192.168.122.15, 22)</text>
    <text x="350" y="255" font-size="10.5" fill="#6A5F4D" text-anchor="middle" font-weight="600">una conexión = cuatro números: IP y puerto de cada extremo</text>
    <text x="350" y="275" font-size="9.5" fill="#9C8F79" text-anchor="middle">cambia uno solo y es otra conversación — así el mismo servidor atiende a cientos de clientes en el mismo puerto</text>
  </g>
</svg>
