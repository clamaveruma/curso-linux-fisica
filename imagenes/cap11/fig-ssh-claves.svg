<svg viewBox="0 0 700 280" width="700" height="280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cómo funciona la autenticación por clave en SSH: clave privada en tu máquina, clave pública en el servidor">
  <defs>
    <marker id="fsk" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6A5F4D"/></marker>
    <marker id="fsg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2F6F62"/></marker>
  </defs>
  <g font-family="IBM Plex Mono,monospace">
    <!-- tu maquina -->
    <rect x="30" y="40" width="240" height="150" rx="6" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.4"/>
    <text x="150" y="64" font-size="11.5" fill="#2B2318" text-anchor="middle" font-weight="600">tu Mint · el cliente</text>
    <rect x="55" y="82" width="190" height="40" rx="4" fill="#F5DED6" stroke="#C4342A" stroke-width="1.5"/>
    <text x="150" y="99" font-size="10.5" fill="#C4342A" text-anchor="middle" font-weight="600">🔑 clave PRIVADA</text>
    <text x="150" y="114" font-size="9" fill="#6A5F4D" text-anchor="middle">~/.ssh/id_ed25519 · no sale de aquí jamás</text>
    <rect x="55" y="134" width="190" height="40" rx="4" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.3"/>
    <text x="150" y="151" font-size="10.5" fill="#24564B" text-anchor="middle" font-weight="600">🔓 clave PÚBLICA</text>
    <text x="150" y="166" font-size="9" fill="#6A5F4D" text-anchor="middle">~/.ssh/id_ed25519.pub · se regala</text>
    <!-- servidor -->
    <rect x="430" y="40" width="240" height="150" rx="6" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.4"/>
    <text x="550" y="64" font-size="11.5" fill="#2B2318" text-anchor="middle" font-weight="600">debian-lab · el servidor</text>
    <rect x="455" y="82" width="190" height="40" rx="4" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.3"/>
    <text x="550" y="99" font-size="10.5" fill="#24564B" text-anchor="middle" font-weight="600">🔓 copia de tu pública</text>
    <text x="550" y="114" font-size="9" fill="#6A5F4D" text-anchor="middle">~/.ssh/authorized_keys</text>
    <text x="550" y="150" font-size="9.5" fill="#6A5F4D" text-anchor="middle">«solo dejo entrar a quien</text>
    <text x="550" y="164" font-size="9.5" fill="#6A5F4D" text-anchor="middle">demuestre tener la privada</text>
    <text x="550" y="178" font-size="9.5" fill="#6A5F4D" text-anchor="middle">que encaja con esta pública»</text>
    <!-- copia de la publica -->
    <path d="M250 154 C 320 154, 380 100, 448 100" fill="none" stroke="#2F6F62" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#fsg)"/>
    <text x="350" y="118" font-size="9.5" fill="#2F6F62" text-anchor="middle" font-weight="600">ssh-copy-id (una vez)</text>
    <!-- reto -->
    <line x1="275" y1="210" x2="425" y2="210" stroke="#6A5F4D" stroke-width="1.5" marker-end="url(#fsk)"/>
    <text x="350" y="204" font-size="9" fill="#6A5F4D" text-anchor="middle">cada conexión: reto → firma con la privada → verificado con la pública</text>
    <text x="350" y="250" font-size="10.5" fill="#9C8F79" text-anchor="middle">nunca viaja una contraseña; la privada nunca viaja; por eso las claves son más seguras Y más cómodas</text>
  </g>
</svg>
