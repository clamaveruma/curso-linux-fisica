<svg viewBox="0 0 700 250" width="700" height="250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Los tres niveles de práctica de SSH: localhost, la máquina virtual y un host real">
  <g font-family="IBM Plex Mono,monospace">
    <!-- escalones -->
    <rect x="40" y="150" width="190" height="60" rx="4" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.4"/>
    <text x="135" y="172" font-size="11" fill="#2B2318" text-anchor="middle" font-weight="600">nivel 0 · localhost</text>
    <text x="135" y="188" font-size="9" fill="#6A5F4D" text-anchor="middle">ssh marcos@127.0.0.1</text>
    <text x="135" y="202" font-size="8.5" fill="#9C8F79" text-anchor="middle">tu Mint hablando consigo misma</text>
    <rect x="255" y="100" width="190" height="60" rx="4" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.5"/>
    <text x="350" y="122" font-size="11" fill="#24564B" text-anchor="middle" font-weight="600">nivel 1 · debian-lab</text>
    <text x="350" y="138" font-size="9" fill="#6A5F4D" text-anchor="middle">ssh marcos@debian-lab</text>
    <text x="350" y="152" font-size="8.5" fill="#9C8F79" text-anchor="middle">un servidor de verdad, a 0,4 ms</text>
    <rect x="470" y="50" width="190" height="60" rx="4" fill="#F5EBD6" stroke="#9A6A14" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="565" y="72" font-size="11" fill="#9A6A14" text-anchor="middle" font-weight="600">nivel 2 · un host real</text>
    <text x="565" y="88" font-size="9" fill="#6A5F4D" text-anchor="middle">ssh usuario@servidor.uma.es</text>
    <text x="565" y="102" font-size="8.5" fill="#9C8F79" text-anchor="middle">si lo tienes: mismo gesto, más km</text>
    <!-- suelo -->
    <line x1="30" y1="215" x2="670" y2="215" stroke="#C9B995" stroke-width="1.3"/>
    <text x="350" y="238" font-size="10" fill="#9C8F79" text-anchor="middle">el curso se escribe contra el nivel 1: nadie queda fuera, y la experiencia es idéntica a un servidor remoto</text>
    <text x="350" y="30" font-size="11" fill="#6A5F4D" text-anchor="middle">el mismo comando, tres distancias — lo único que cambia es lo que hay después de la @</text>
  </g>
</svg>
