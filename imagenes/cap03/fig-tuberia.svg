<svg viewBox="0 0 700 260" width="700" height="260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="La tubería del análisis: grep, cut, sort y uniq encadenados">
  <g font-family="IBM Plex Mono,monospace">
    <!-- fichero de entrada -->
    <g>
      <ellipse cx="65" cy="52" rx="42" ry="10" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.3"/>
      <path d="M23 52 v46 a42 10 0 0 0 84 0 v-46" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.3"/>
      <ellipse cx="65" cy="98" rx="42" ry="10" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.3"/>
      <text x="65" y="80" font-size="9.5" fill="#6A5F4D" text-anchor="middle">adquisicion.log</text>
      <text x="65" y="130" font-size="9.5" fill="#9C8F79" text-anchor="middle">7 198 líneas</text>
    </g>
    <!-- etapa 1 -->
    <text x="123" y="80" font-size="16" fill="#C4342A" font-weight="600">→</text>
    <rect x="145" y="55" width="105" height="42" rx="4" fill="#0E1512"/>
    <text x="197" y="81" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">grep ERROR</text>
    <text x="197" y="115" font-size="9.5" fill="#6A5F4D" text-anchor="middle">quedan 108 líneas</text>
    <text x="197" y="129" font-size="9.5" fill="#9C8F79" text-anchor="middle">solo los fallos</text>
    <!-- etapa 2 -->
    <text x="258" y="80" font-size="15" fill="#2F6F62" font-weight="600">|</text>
    <rect x="272" y="55" width="118" height="42" rx="4" fill="#0E1512"/>
    <text x="331" y="75" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">cut -d' ' -f4</text>
    <text x="331" y="90" font-size="9" fill="#D8E6E0" text-anchor="middle">columna del sensor</text>
    <text x="331" y="115" font-size="9.5" fill="#6A5F4D" text-anchor="middle">108 nombres:</text>
    <text x="331" y="129" font-size="9.5" fill="#9C8F79" text-anchor="middle">s3 s3 s1 s3 …</text>
    <!-- etapa 3 -->
    <text x="398" y="80" font-size="15" fill="#2F6F62" font-weight="600">|</text>
    <rect x="412" y="55" width="80" height="42" rx="4" fill="#0E1512"/>
    <text x="452" y="81" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">sort</text>
    <text x="452" y="115" font-size="9.5" fill="#6A5F4D" text-anchor="middle">iguales, juntos:</text>
    <text x="452" y="129" font-size="9.5" fill="#9C8F79" text-anchor="middle">s1…s1 s3…s3 s4…</text>
    <!-- etapa 4 -->
    <text x="500" y="80" font-size="15" fill="#2F6F62" font-weight="600">|</text>
    <rect x="514" y="55" width="95" height="42" rx="4" fill="#0E1512"/>
    <text x="561" y="81" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">uniq -c</text>
    <text x="561" y="115" font-size="9.5" fill="#6A5F4D" text-anchor="middle">recuenta grupos</text>
    <!-- resultado -->
    <text x="617" y="80" font-size="16" fill="#2F6F62" font-weight="600">→</text>
    <rect x="632" y="42" width="58" height="68" rx="3" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.4"/>
    <text x="646" y="63" font-size="10.5" fill="#24564B">90 s3</text>
    <text x="646" y="80" font-size="10.5" fill="#24564B">15 s1</text>
    <text x="646" y="97" font-size="10.5" fill="#24564B"> 3 s4</text>
    <text x="661" y="129" font-size="9.5" fill="#6A5F4D" text-anchor="middle">el veredicto</text>
    <!-- moraleja -->
    <text x="350" y="180" font-size="11.5" fill="#6A5F4D" text-anchor="middle">cada programa hace una sola cosa; la tubería <tspan fill="#2F6F62" font-weight="600">|</tspan> conecta la salida de uno con la entrada del siguiente</text>
    <text x="350" y="202" font-size="10.5" fill="#9C8F79" text-anchor="middle">7 198 líneas → una respuesta: el sensor s3 es el culpable, con 90 fallos</text>
    <text x="350" y="230" font-size="10" fill="#9C8F79" text-anchor="middle">se construye pieza a pieza, mirando qué sale en cada paso</text>
  </g>
</svg>
