<svg viewBox="0 0 700 250" width="700" height="250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Redirección con el símbolo mayor que: el resultado va al fichero, los errores siguen en pantalla">
  <defs>
    <marker id="frd" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2F6F62"/></marker>
    <marker id="fre" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#C4342A"/></marker>
  </defs>
  <g font-family="IBM Plex Mono,monospace">
    <!-- programa -->
    <rect x="60" y="75" width="150" height="66" rx="5" fill="#0E1512"/>
    <text x="135" y="104" font-size="14" fill="#6BD6BC" text-anchor="middle" font-weight="600">grep ERROR</text>
    <text x="135" y="124" font-size="10.5" fill="#D8E6E0" text-anchor="middle">trabaja igual que siempre</text>
    <!-- stdout hacia fichero -->
    <path d="M215 95 C 300 70, 360 70, 425 95" fill="none" stroke="#2F6F62" stroke-width="2" marker-end="url(#frd)"/>
    <text x="320" y="62" font-size="13" fill="#2F6F62" text-anchor="middle" font-weight="600">1 · stdout   &gt;</text>
    <text x="320" y="108" font-size="9.5" fill="#9C8F79" text-anchor="middle">desviado: ya no va a la pantalla</text>
    <!-- fichero -->
    <path d="M432 62 h95 l28 28 v75 h-123 z" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.4"/>
    <path d="M527 62 v28 h28" fill="none" stroke="#9C8F79" stroke-width="1.4"/>
    <text x="493" y="112" font-size="11.5" fill="#2B2318" text-anchor="middle" font-weight="600">errores.txt</text>
    <text x="493" y="132" font-size="9" fill="#6A5F4D" text-anchor="middle">2026-08-18 10:03:00…</text>
    <text x="493" y="146" font-size="9" fill="#6A5F4D" text-anchor="middle">2026-08-18 10:03:02…</text>
    <!-- stderr hacia pantalla -->
    <path d="M215 125 C 300 165, 380 175, 555 175" fill="none" stroke="#C4342A" stroke-width="2" marker-end="url(#fre)"/>
    <text x="350" y="200" font-size="13" fill="#C4342A" text-anchor="middle" font-weight="600">2 · stderr</text>
    <text x="350" y="217" font-size="9.5" fill="#9C8F79" text-anchor="middle">las quejas siguen en pantalla, donde quieres verlas</text>
    <!-- pantalla -->
    <rect x="565" y="145" width="105" height="62" rx="5" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.4"/>
    <rect x="574" y="153" width="87" height="38" rx="2" fill="#0E1512"/>
    <text x="581" y="176" font-size="8.5" fill="#E8837A">aviso: …</text>
    <text x="617" y="223" font-size="10" fill="#6A5F4D" text-anchor="middle">pantalla</text>
    <text x="245" y="238" font-size="10.5" fill="#6A5F4D" text-anchor="middle">&gt; escribe el fichero desde cero (borra lo anterior) · &gt;&gt; añade al final</text>
  </g>
</svg>
