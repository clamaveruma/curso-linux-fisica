<svg viewBox="0 0 700 440" width="700" height="440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="El mapa completo del árbol de directorios de Linux">
  <g font-family="IBM Plex Mono,monospace" font-size="13.5">
    <text x="55" y="38" fill="#C4342A" font-weight="600" font-size="17">/</text>
    <text x="85" y="38" fill="#9C8F79" font-size="11">la raíz — todo el mapa de una vez</text>
    <line x1="61" y1="48" x2="61" y2="412" stroke="#C9B995" stroke-width="1.5"/>
    <!-- bin -->
    <line x1="61" y1="70" x2="92" y2="70" stroke="#C9B995" stroke-width="1.5"/>
    <text x="100" y="75" fill="#2F6F62" font-weight="600">bin/</text>
    <text x="230" y="75" fill="#6A5F4D" font-size="11.5">los programas esenciales — ls, cp, bash viven aquí</text>
    <!-- boot -->
    <line x1="61" y1="102" x2="92" y2="102" stroke="#C9B995" stroke-width="1.5"/>
    <text x="100" y="107" fill="#2F6F62" font-weight="600">boot/</text>
    <text x="230" y="107" fill="#6A5F4D" font-size="11.5">lo que arranca la máquina — protagonista del cap. 6</text>
    <!-- dev -->
    <line x1="61" y1="134" x2="92" y2="134" stroke="#C9B995" stroke-width="1.5"/>
    <text x="100" y="139" fill="#2F6F62" font-weight="600">dev/</text>
    <text x="230" y="139" fill="#6A5F4D" font-size="11.5">los dispositivos, disfrazados de ficheros (tu tty está aquí)</text>
    <!-- etc -->
    <line x1="61" y1="166" x2="92" y2="166" stroke="#C9B995" stroke-width="1.5"/>
    <text x="100" y="171" fill="#C4342A" font-weight="600">etc/</text>
    <text x="230" y="171" fill="#6A5F4D" font-size="11.5">LA configuración del sistema, en ficheros de texto</text>
    <!-- home -->
    <line x1="61" y1="198" x2="92" y2="198" stroke="#C9B995" stroke-width="1.5"/>
    <text x="100" y="203" fill="#C4342A" font-weight="600">home/</text>
    <text x="230" y="203" fill="#6A5F4D" font-size="11.5">las casas de los usuarios — la tuya: /home/marcos = ~</text>
    <!-- lib -->
    <line x1="61" y1="230" x2="92" y2="230" stroke="#C9B995" stroke-width="1.5"/>
    <text x="100" y="235" fill="#2F6F62" font-weight="600">lib/</text>
    <text x="230" y="235" fill="#6A5F4D" font-size="11.5">bibliotecas: código que los programas comparten</text>
    <!-- proc -->
    <line x1="61" y1="262" x2="92" y2="262" stroke="#C9B995" stroke-width="1.5"/>
    <text x="100" y="267" fill="#9A6A14" font-weight="600">proc/</text>
    <text x="230" y="267" fill="#6A5F4D" font-size="11.5">el sistema mirándose a sí mismo — no existe en el disco</text>
    <!-- root -->
    <line x1="61" y1="294" x2="92" y2="294" stroke="#C9B995" stroke-width="1.5"/>
    <text x="100" y="299" fill="#2F6F62" font-weight="600">root/</text>
    <text x="230" y="299" fill="#6A5F4D" font-size="11.5">la casa del administrador — hoy llamarás a su puerta</text>
    <!-- tmp -->
    <line x1="61" y1="326" x2="92" y2="326" stroke="#C9B995" stroke-width="1.5"/>
    <text x="100" y="331" fill="#2F6F62" font-weight="600">tmp/</text>
    <text x="230" y="331" fill="#6A5F4D" font-size="11.5">papelera de trabajo — se vacía en cada arranque</text>
    <!-- usr -->
    <line x1="61" y1="358" x2="92" y2="358" stroke="#C9B995" stroke-width="1.5"/>
    <text x="100" y="363" fill="#2F6F62" font-weight="600">usr/</text>
    <text x="230" y="363" fill="#6A5F4D" font-size="11.5">el grueso: casi todos los programas y sus datos</text>
    <!-- var -->
    <line x1="61" y1="390" x2="92" y2="390" stroke="#C9B995" stroke-width="1.5"/>
    <text x="100" y="395" fill="#C4342A" font-weight="600">var/</text>
    <text x="230" y="395" fill="#6A5F4D" font-size="11.5">lo que varía: registros (var/log), colas, cachés</text>
    <text x="350" y="428" fill="#9C8F79" font-size="10.5" text-anchor="middle">en rojo, los tres que un físico visita de verdad · el resto, saber que están y qué son</text>
  </g>
</svg>
