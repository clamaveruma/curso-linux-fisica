<svg viewBox="0 0 700 260" width="700" height="260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="tmux: la sesión vive en el servidor y sobrevive a la desconexión del portátil">
  <defs>
    <marker id="ftx" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2F6F62"/></marker>
  </defs>
  <g font-family="IBM Plex Mono,monospace">
    <!-- servidor -->
    <rect x="380" y="30" width="300" height="200" rx="6" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.4"/>
    <text x="530" y="54" font-size="11.5" fill="#2B2318" text-anchor="middle" font-weight="600">el servidor · debian-lab</text>
    <rect x="400" y="70" width="260" height="140" rx="4" fill="#0E1512"/>
    <text x="530" y="92" font-size="11" fill="#6BD6BC" text-anchor="middle" font-weight="600">sesión tmux «simulacion»</text>
    <text x="412" y="115" font-size="9.5" fill="#D8E6E0">$ python3 simula.py</text>
    <text x="412" y="132" font-size="9.5" fill="#9FB4AC">paso 3200 / 10000 …</text>
    <text x="412" y="149" font-size="9.5" fill="#9FB4AC">paso 3300 / 10000 …</text>
    <text x="412" y="166" font-size="9.5" fill="#9FB4AC">paso 3400 / 10000 …</text>
    <text x="530" y="198" font-size="9" fill="#7E938C" text-anchor="middle">sigue corriendo aunque nadie mire</text>
    <!-- portatil día 1 -->
    <rect x="30" y="40" width="150" height="60" rx="4" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.3"/>
    <text x="105" y="62" font-size="10.5" fill="#24564B" text-anchor="middle" font-weight="600">lunes · tu portátil</text>
    <text x="105" y="80" font-size="9" fill="#6A5F4D" text-anchor="middle">ssh lab · tmux · lanzar</text>
    <text x="105" y="94" font-size="9" fill="#6A5F4D" text-anchor="middle">Ctrl-b d · cerrar tapa</text>
    <line x1="185" y1="70" x2="372" y2="100" stroke="#2F6F62" stroke-width="1.6" marker-end="url(#ftx)"/>
    <!-- corte -->
    <text x="105" y="140" font-size="10" fill="#C4342A" text-anchor="middle" font-weight="600">✂ desconectado</text>
    <text x="105" y="155" font-size="8.5" fill="#9C8F79" text-anchor="middle">Wi-Fi caída, portátil apagado,</text>
    <text x="105" y="168" font-size="8.5" fill="#9C8F79" text-anchor="middle">tú en otra ciudad — da igual</text>
    <!-- portatil día 2 -->
    <rect x="30" y="185" width="150" height="55" rx="4" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.3"/>
    <text x="105" y="206" font-size="10.5" fill="#24564B" text-anchor="middle" font-weight="600">martes · desde donde sea</text>
    <text x="105" y="224" font-size="9" fill="#6A5F4D" text-anchor="middle">ssh lab · tmux attach</text>
    <line x1="185" y1="210" x2="372" y2="160" stroke="#2F6F62" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ftx)"/>
    <text x="278" y="245" font-size="9.5" fill="#9C8F79" text-anchor="middle">sin tmux, cerrar la conexión mata el programa</text>
  </g>
</svg>
