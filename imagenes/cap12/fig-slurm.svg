<svg viewBox="0 0 700 260" width="700" height="260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Un clúster con SLURM: nodo de acceso, cola de trabajos y nodos de cálculo">
  <defs>
    <marker id="fsl" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6A5F4D"/></marker>
  </defs>
  <g font-family="IBM Plex Mono,monospace">
    <!-- login -->
    <rect x="30" y="80" width="150" height="70" rx="5" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.4"/>
    <text x="105" y="104" font-size="11" fill="#24564B" text-anchor="middle" font-weight="600">nodo de acceso</text>
    <text x="105" y="121" font-size="9" fill="#6A5F4D" text-anchor="middle">donde entras por ssh</text>
    <text x="105" y="136" font-size="9" fill="#C4342A" text-anchor="middle">aquí NO se calcula</text>
    <!-- cola -->
    <line x1="185" y1="115" x2="240" y2="115" stroke="#6A5F4D" stroke-width="1.6" marker-end="url(#fsl)"/>
    <text x="212" y="105" font-size="9" fill="#6A5F4D" text-anchor="middle">sbatch</text>
    <rect x="248" y="60" width="150" height="110" rx="5" fill="#F5EBD6" stroke="#9A6A14" stroke-width="1.4"/>
    <text x="323" y="82" font-size="11" fill="#9A6A14" text-anchor="middle" font-weight="600">la cola · SLURM</text>
    <rect x="262" y="94" width="122" height="16" rx="2" fill="#FAF6EB" stroke="#9C8F79" stroke-width=".8"/>
    <text x="323" y="106" font-size="8.5" fill="#6A5F4D" text-anchor="middle">ana · 64 CPU · 12 h</text>
    <rect x="262" y="114" width="122" height="16" rx="2" fill="#FAF6EB" stroke="#9C8F79" stroke-width=".8"/>
    <text x="323" y="126" font-size="8.5" fill="#6A5F4D" text-anchor="middle">luis · 8 CPU · 2 h</text>
    <rect x="262" y="134" width="122" height="16" rx="2" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1"/>
    <text x="323" y="146" font-size="8.5" fill="#24564B" text-anchor="middle" font-weight="600">tú · 4 CPU · 1 h</text>
    <text x="323" y="164" font-size="8" fill="#9C8F79" text-anchor="middle">reparte por prioridad y tamaño</text>
    <!-- nodos -->
    <line x1="403" y1="115" x2="458" y2="115" stroke="#6A5F4D" stroke-width="1.6" marker-end="url(#fsl)"/>
    <g>
      <rect x="466" y="40" width="200" height="34" rx="3" fill="#0E1512"/>
      <text x="566" y="61" font-size="9.5" fill="#6BD6BC" text-anchor="middle">nodo01 · 128 CPU · ocupado</text>
      <rect x="466" y="80" width="200" height="34" rx="3" fill="#0E1512"/>
      <text x="566" y="101" font-size="9.5" fill="#6BD6BC" text-anchor="middle">nodo02 · 128 CPU · ocupado</text>
      <rect x="466" y="120" width="200" height="34" rx="3" fill="#0E1512"/>
      <text x="566" y="141" font-size="9.5" fill="#E8C170" text-anchor="middle">nodo03 · 128 CPU · tu trabajo</text>
      <rect x="466" y="160" width="200" height="34" rx="3" fill="#0E1512"/>
      <text x="566" y="181" font-size="9.5" fill="#7E938C" text-anchor="middle">… nodo48</text>
    </g>
    <text x="566" y="212" font-size="9" fill="#9C8F79" text-anchor="middle">nodos de cálculo: no se entra en ellos, se les envía trabajo</text>
    <text x="350" y="245" font-size="10" fill="#6A5F4D" text-anchor="middle">un clúster es tiempo compartido (cap. 4) a escala de edificio: se pide, se espera turno, se recoge el resultado</text>
  </g>
</svg>
