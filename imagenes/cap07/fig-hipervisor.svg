<svg viewBox="0 0 700 320" width="700" height="320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Qué se virtualiza: una máquina de mentira dentro de tu máquina de verdad">
  <g font-family="IBM Plex Mono,monospace">
    <!-- anfitrión -->
    <rect x="20" y="20" width="660" height="280" rx="6" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.4"/>
    <text x="36" y="44" font-size="12" fill="#2B2318" font-weight="600">TU MÁQUINA DE VERDAD · el anfitrión (Mint)</text>
    <!-- hardware real -->
    <rect x="36" y="232" width="628" height="52" rx="4" fill="#0E1512"/>
    <text x="350" y="253" font-size="11.5" fill="#6BD6BC" text-anchor="middle" font-weight="600">hardware real</text>
    <text x="110" y="273" font-size="10" fill="#D8E6E0" text-anchor="middle">CPU · 8 núcleos</text>
    <text x="270" y="273" font-size="10" fill="#D8E6E0" text-anchor="middle">RAM · 16 GB</text>
    <text x="430" y="273" font-size="10" fill="#D8E6E0" text-anchor="middle">disco · 477 GB</text>
    <text x="590" y="273" font-size="10" fill="#D8E6E0" text-anchor="middle">tarjeta de red</text>
    <!-- hipervisor -->
    <rect x="36" y="186" width="628" height="36" rx="4" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.4"/>
    <text x="350" y="209" font-size="11.5" fill="#24564B" text-anchor="middle" font-weight="600">HIPERVISOR · reparte el hardware real y finge el de mentira</text>
    <!-- VM -->
    <rect x="200" y="62" width="300" height="112" rx="5" fill="#F5EBD6" stroke="#9A6A14" stroke-width="1.6"/>
    <text x="350" y="84" font-size="12" fill="#9A6A14" text-anchor="middle" font-weight="600">LA MÁQUINA VIRTUAL · el huésped (Debian)</text>
    <text x="350" y="101" font-size="9.5" fill="#6A5F4D" text-anchor="middle">cree tener un ordenador entero para ella sola</text>
    <rect x="215" y="112" width="60" height="44" rx="3" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1"/>
    <text x="245" y="131" font-size="9.5" fill="#2B2318" text-anchor="middle">2 CPU</text>
    <text x="245" y="146" font-size="8.5" fill="#9C8F79" text-anchor="middle">prestadas</text>
    <rect x="285" y="112" width="60" height="44" rx="3" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1"/>
    <text x="315" y="131" font-size="9.5" fill="#2B2318" text-anchor="middle">4 GB</text>
    <text x="315" y="146" font-size="8.5" fill="#9C8F79" text-anchor="middle">de la RAM</text>
    <rect x="355" y="112" width="60" height="44" rx="3" fill="#FAF6EB" stroke="#C4342A" stroke-width="1.2"/>
    <text x="385" y="131" font-size="9.5" fill="#C4342A" text-anchor="middle">disco</text>
    <text x="385" y="146" font-size="8.5" fill="#9C8F79" text-anchor="middle">= un fichero</text>
    <rect x="425" y="112" width="60" height="44" rx="3" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1"/>
    <text x="455" y="131" font-size="9.5" fill="#2B2318" text-anchor="middle">red</text>
    <text x="455" y="146" font-size="8.5" fill="#9C8F79" text-anchor="middle">virtual</text>
    <!-- nota disco -->
    <text x="590" y="120" font-size="9.5" fill="#C4342A" text-anchor="middle">su «disco duro» es</text>
    <text x="590" y="134" font-size="9.5" fill="#C4342A" text-anchor="middle">un fichero de 20 GB</text>
    <text x="590" y="148" font-size="9.5" fill="#C4342A" text-anchor="middle">en tu casa (~)</text>
    <text x="110" y="120" font-size="9.5" fill="#6A5F4D" text-anchor="middle">tu escritorio sigue</text>
    <text x="110" y="134" font-size="9.5" fill="#6A5F4D" text-anchor="middle">funcionando al lado:</text>
    <text x="110" y="148" font-size="9.5" fill="#6A5F4D" text-anchor="middle">es una ventana más</text>
  </g>
</svg>
