<svg viewBox="0 0 700 300" width="700" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dos formas de conectar la máquina virtual: NAT y puente">
  <defs>
    <marker id="fnv" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6A5F4D"/></marker>
  </defs>
  <g font-family="IBM Plex Mono,monospace">
    <!-- panel NAT -->
    <rect x="15" y="15" width="325" height="270" rx="4" fill="#FAF6EB" stroke="#9A6A14" stroke-width="1.3"/>
    <text x="35" y="42" font-size="12" fill="#9A6A14" font-weight="600" letter-spacing="1">NAT (por defecto)</text>
    <text x="35" y="59" font-size="10" fill="#9C8F79">la VM se esconde detrás de tu máquina</text>
    <rect x="40" y="80" width="130" height="50" rx="4" fill="#F5EBD6" stroke="#9A6A14" stroke-width="1.2"/>
    <text x="105" y="100" font-size="10.5" fill="#2B2318" text-anchor="middle" font-weight="600">VM</text>
    <text x="105" y="118" font-size="9" fill="#6A5F4D" text-anchor="middle">192.168.122.15</text>
    <rect x="200" y="80" width="120" height="50" rx="4" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.2"/>
    <text x="260" y="100" font-size="10.5" fill="#2B2318" text-anchor="middle" font-weight="600">tu Mint</text>
    <text x="260" y="118" font-size="9" fill="#6A5F4D" text-anchor="middle">192.168.1.34</text>
    <line x1="172" y1="105" x2="196" y2="105" stroke="#6A5F4D" stroke-width="1.6" marker-end="url(#fnv)"/>
    <rect x="200" y="175" width="120" height="44" rx="4" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.2"/>
    <text x="260" y="193" font-size="10.5" fill="#2B2318" text-anchor="middle" font-weight="600">router de casa</text>
    <text x="260" y="209" font-size="9" fill="#6A5F4D" text-anchor="middle">solo ve a tu Mint</text>
    <line x1="260" y1="133" x2="260" y2="170" stroke="#6A5F4D" stroke-width="1.6" marker-end="url(#fnv)"/>
    <text x="105" y="165" font-size="9.5" fill="#6A5F4D" text-anchor="middle">sale a internet</text>
    <text x="105" y="179" font-size="9.5" fill="#6A5F4D" text-anchor="middle">sin configurar nada</text>
    <text x="105" y="200" font-size="9.5" fill="#24564B" text-anchor="middle">tu Mint sí puede</text>
    <text x="105" y="214" font-size="9.5" fill="#24564B" text-anchor="middle">hablar con ella (SSH)</text>
    <text x="177" y="260" font-size="9.5" fill="#9C8F79" text-anchor="middle">el resto de la casa no la ve</text>
    <!-- panel puente -->
    <rect x="360" y="15" width="325" height="270" rx="4" fill="#FAF6EB" stroke="#2F6F62" stroke-width="1.3"/>
    <text x="380" y="42" font-size="12" fill="#24564B" font-weight="600" letter-spacing="1">PUENTE (bridge)</text>
    <text x="380" y="59" font-size="10" fill="#9C8F79">la VM es un aparato más de tu red</text>
    <rect x="385" y="80" width="130" height="50" rx="4" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.2"/>
    <text x="450" y="100" font-size="10.5" fill="#2B2318" text-anchor="middle" font-weight="600">VM</text>
    <text x="450" y="118" font-size="9" fill="#6A5F4D" text-anchor="middle">192.168.1.57</text>
    <rect x="545" y="80" width="120" height="50" rx="4" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.2"/>
    <text x="605" y="100" font-size="10.5" fill="#2B2318" text-anchor="middle" font-weight="600">tu Mint</text>
    <text x="605" y="118" font-size="9" fill="#6A5F4D" text-anchor="middle">192.168.1.34</text>
    <rect x="465" y="175" width="120" height="44" rx="4" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.2"/>
    <text x="525" y="193" font-size="10.5" fill="#2B2318" text-anchor="middle" font-weight="600">router de casa</text>
    <text x="525" y="209" font-size="9" fill="#6A5F4D" text-anchor="middle">le da IP como a cualquiera</text>
    <line x1="450" y1="133" x2="500" y2="170" stroke="#6A5F4D" stroke-width="1.6" marker-end="url(#fnv)"/>
    <line x1="605" y1="133" x2="555" y2="170" stroke="#6A5F4D" stroke-width="1.6" marker-end="url(#fnv)"/>
    <text x="522" y="260" font-size="9.5" fill="#9C8F79" text-anchor="middle">aparecerá en el censo del router (bloque D)</text>
  </g>
</svg>
