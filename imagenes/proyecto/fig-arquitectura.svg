<svg viewBox="0 0 700 320" width="700" height="320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arquitectura del proyecto final: el portátil con Mint y el servidor Debian en la máquina virtual, unidos por SSH">
  <defs>
    <marker id="fpa1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2F6F62"/></marker>
    <marker id="fpa2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#9A6A14"/></marker>
  </defs>
  <g font-family="IBM Plex Mono,monospace">
    <!-- Mint -->
    <rect x="20" y="30" width="250" height="250" rx="6" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.4"/>
    <text x="145" y="54" font-size="11.5" fill="#2B2318" text-anchor="middle" font-weight="600">tu Mint · el cliente</text>
    <rect x="38" y="70" width="214" height="34" rx="3" fill="#F5DED6" stroke="#C4342A" stroke-width="1.2"/>
    <text x="145" y="91" font-size="9.5" fill="#C4342A" text-anchor="middle">🔑 clave privada · ~/.ssh/config</text>
    <rect x="38" y="112" width="214" height="34" rx="3" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.2"/>
    <text x="145" y="133" font-size="9.5" fill="#24564B" text-anchor="middle">datasets de los caps. 2 y 3</text>
    <rect x="38" y="154" width="214" height="34" rx="3" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.2"/>
    <text x="145" y="175" font-size="9.5" fill="#24564B" text-anchor="middle">navegador ← túnel 8888</text>
    <rect x="38" y="196" width="214" height="34" rx="3" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.1"/>
    <text x="145" y="217" font-size="9.5" fill="#6A5F4D" text-anchor="middle">resultados/ · recogidos</text>
    <text x="145" y="262" font-size="9" fill="#9C8F79" text-anchor="middle">cuaderno: script proyecto.log</text>
    <!-- red -->
    <text x="350" y="58" font-size="9.5" fill="#9C8F79" text-anchor="middle">red NAT de libvirt</text>
    <text x="350" y="72" font-size="9.5" fill="#9C8F79" text-anchor="middle">192.168.122.0/24</text>
    <line x1="275" y1="120" x2="425" y2="120" stroke="#2F6F62" stroke-width="1.8" marker-end="url(#fpa1)"/>
    <text x="350" y="112" font-size="9.5" fill="#2F6F62" text-anchor="middle" font-weight="600">rsync datos →</text>
    <line x1="275" y1="160" x2="425" y2="160" stroke="#2F6F62" stroke-width="1.8" marker-end="url(#fpa1)"/>
    <text x="350" y="152" font-size="9.5" fill="#2F6F62" text-anchor="middle" font-weight="600">ssh servidor · solo claves</text>
    <line x1="425" y1="212" x2="275" y2="212" stroke="#9A6A14" stroke-width="1.8" marker-end="url(#fpa2)"/>
    <text x="350" y="204" font-size="9.5" fill="#9A6A14" text-anchor="middle" font-weight="600">← rsync resultados</text>
    <!-- servidor -->
    <rect x="430" y="30" width="250" height="250" rx="6" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.4"/>
    <text x="555" y="54" font-size="11.5" fill="#2B2318" text-anchor="middle" font-weight="600">«servidor» · VM Debian</text>
    <rect x="448" y="70" width="214" height="34" rx="3" fill="#0E1512"/>
    <text x="555" y="91" font-size="9.5" fill="#6BD6BC" text-anchor="middle">sshd :22 · PasswordAuthentication no</text>
    <rect x="448" y="112" width="214" height="34" rx="3" fill="#0E1512"/>
    <text x="555" y="133" font-size="9.5" fill="#6BD6BC" text-anchor="middle">~/proyecto/datos · ~/proyecto/resultados</text>
    <rect x="448" y="154" width="214" height="34" rx="3" fill="#0E1512"/>
    <text x="555" y="175" font-size="9.5" fill="#E8C170" text-anchor="middle">tmux «analisis» → analisis.py</text>
    <rect x="448" y="196" width="214" height="34" rx="3" fill="#0E1512"/>
    <text x="555" y="217" font-size="9.5" fill="#D8E6E0" text-anchor="middle">sin escritorio · EFI + / + swap</text>
    <text x="555" y="262" font-size="9" fill="#9C8F79" text-anchor="middle">instantánea «recien-instalado»</text>
    <text x="350" y="305" font-size="10" fill="#6A5F4D" text-anchor="middle">doce capítulos en una figura: lo que un físico monta el primer día con una máquina nueva</text>
  </g>
</svg>
