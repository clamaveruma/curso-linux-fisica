<svg viewBox="0 0 700 300" width="700" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nivel 2 y nivel 3: el switch reparte dentro de la red por MAC; el router conecta redes por IP; la caja de casa hace de ambos">
  <defs>
    <marker id="fsr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6A5F4D"/></marker>
  </defs>
  <g font-family="IBM Plex Mono,monospace">
    <!-- red local -->
    <rect x="20" y="40" width="400" height="220" rx="6" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.3" stroke-dasharray="6 4"/>
    <text x="36" y="62" font-size="11" fill="#2B2318" font-weight="600">tu red · 192.168.1.0/24 · nivel 2: todos se ven por MAC</text>
    <rect x="40" y="90" width="90" height="40" rx="3" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.1"/>
    <text x="85" y="107" font-size="9.5" fill="#2B2318" text-anchor="middle" font-weight="600">portátil</text>
    <text x="85" y="122" font-size="8" fill="#6A5F4D" text-anchor="middle">a4:34:…</text>
    <rect x="40" y="150" width="90" height="40" rx="3" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.1"/>
    <text x="85" y="167" font-size="9.5" fill="#2B2318" text-anchor="middle" font-weight="600">móvil</text>
    <text x="85" y="182" font-size="8" fill="#6A5F4D" text-anchor="middle">8e:12:…</text>
    <rect x="40" y="210" width="90" height="40" rx="3" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.1"/>
    <text x="85" y="227" font-size="9.5" fill="#2B2318" text-anchor="middle" font-weight="600">impresora</text>
    <text x="85" y="242" font-size="8" fill="#6A5F4D" text-anchor="middle">00:1b:…</text>
    <!-- switch -->
    <rect x="175" y="130" width="100" height="56" rx="4" fill="#F5EBD6" stroke="#9A6A14" stroke-width="1.4"/>
    <text x="225" y="152" font-size="10.5" fill="#9A6A14" text-anchor="middle" font-weight="600">SWITCH</text>
    <text x="225" y="168" font-size="8" fill="#6A5F4D" text-anchor="middle">(y el punto Wi-Fi)</text>
    <text x="225" y="180" font-size="8" fill="#6A5F4D" text-anchor="middle">reparte por MAC</text>
    <line x1="132" y1="110" x2="172" y2="145" stroke="#6A5F4D" stroke-width="1.2"/>
    <line x1="132" y1="170" x2="172" y2="160" stroke="#6A5F4D" stroke-width="1.2"/>
    <line x1="132" y1="230" x2="172" y2="175" stroke="#6A5F4D" stroke-width="1.2"/>
    <!-- router -->
    <rect x="310" y="130" width="100" height="56" rx="4" fill="#F5DED6" stroke="#C4342A" stroke-width="1.4"/>
    <text x="360" y="152" font-size="10.5" fill="#C4342A" text-anchor="middle" font-weight="600">ROUTER</text>
    <text x="360" y="168" font-size="8" fill="#6A5F4D" text-anchor="middle">nivel 3: lee la IP</text>
    <text x="360" y="180" font-size="8" fill="#6A5F4D" text-anchor="middle">y cambia de red</text>
    <line x1="277" y1="158" x2="308" y2="158" stroke="#6A5F4D" stroke-width="1.4"/>
    <!-- fuera -->
    <line x1="412" y1="158" x2="470" y2="158" stroke="#6A5F4D" stroke-width="1.6" marker-end="url(#fsr2)"/>
    <ellipse cx="570" cy="158" rx="90" ry="46" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.3"/>
    <text x="570" y="152" font-size="10.5" fill="#2B2318" text-anchor="middle" font-weight="600">otras redes</text>
    <text x="570" y="168" font-size="8.5" fill="#6A5F4D" text-anchor="middle">la compañía, internet</text>
    <text x="570" y="182" font-size="8" fill="#9C8F79" text-anchor="middle">nadie ve tus MAC</text>
    <text x="350" y="285" font-size="10" fill="#6A5F4D" text-anchor="middle">la caja de tu compañía lleva las dos cosas dentro — más el DHCP, un DNS y un cortafuegos — pero son papeles distintos</text>
  </g>
</svg>
