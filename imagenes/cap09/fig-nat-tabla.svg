<svg viewBox="0 0 700 320" width="700" height="320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cómo traduce el router: reescribe el remitente, apunta en su tabla, y deshace la traducción con la respuesta">
  <defs>
    <marker id="fnt1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2F6F62"/></marker>
    <marker id="fnt2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#9A6A14"/></marker>
  </defs>
  <g font-family="IBM Plex Mono,monospace">
    <!-- portatil -->
    <rect x="20" y="50" width="150" height="46" rx="4" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.2"/>
    <text x="95" y="69" font-size="10.5" fill="#2B2318" text-anchor="middle" font-weight="600">portátil</text>
    <text x="95" y="86" font-size="9" fill="#6A5F4D" text-anchor="middle">192.168.1.34</text>
    <rect x="20" y="200" width="150" height="46" rx="4" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.2"/>
    <text x="95" y="219" font-size="10.5" fill="#2B2318" text-anchor="middle" font-weight="600">móvil</text>
    <text x="95" y="236" font-size="9" fill="#6A5F4D" text-anchor="middle">192.168.1.57</text>
    <!-- router con tabla -->
    <rect x="240" y="40" width="240" height="220" rx="5" fill="#F5EBD6" stroke="#9A6A14" stroke-width="1.5"/>
    <text x="360" y="62" font-size="11" fill="#9A6A14" text-anchor="middle" font-weight="600">ROUTER · la libreta NAT</text>
    <text x="360" y="78" font-size="8.5" fill="#6A5F4D" text-anchor="middle">dentro 192.168.1.1 · fuera 83.44.120.9</text>
    <rect x="252" y="90" width="216" height="18" rx="2" fill="#FAF6EB" stroke="#9C8F79" stroke-width=".8"/>
    <text x="360" y="103" font-size="8" fill="#6A5F4D" text-anchor="middle" font-weight="600">dentro            fuera            destino</text>
    <rect x="252" y="112" width="216" height="30" rx="2" fill="#DFE9DF" stroke="#2F6F62" stroke-width=".9"/>
    <text x="360" y="124" font-size="7.8" fill="#24564B" text-anchor="middle">192.168.1.34:51234 ↔ 83.44.120.9:51234</text>
    <text x="360" y="136" font-size="7.8" fill="#6A5F4D" text-anchor="middle">→ 151.101.66.132:443</text>
    <rect x="252" y="146" width="216" height="30" rx="2" fill="#FAF6EB" stroke="#9C8F79" stroke-width=".9"/>
    <text x="360" y="158" font-size="7.8" fill="#2B2318" text-anchor="middle">192.168.1.57:58001 ↔ 83.44.120.9:58001</text>
    <text x="360" y="170" font-size="7.8" fill="#6A5F4D" text-anchor="middle">→ 142.250.184.14:443</text>
    <text x="360" y="200" font-size="8.5" fill="#6A5F4D" text-anchor="middle">al salir: reescribe el remitente</text>
    <text x="360" y="213" font-size="8.5" fill="#6A5F4D" text-anchor="middle">y apunta la línea</text>
    <text x="360" y="232" font-size="8.5" fill="#6A5F4D" text-anchor="middle">al volver: busca la línea</text>
    <text x="360" y="245" font-size="8.5" fill="#6A5F4D" text-anchor="middle">y reescribe el destinatario</text>
    <!-- internet -->
    <ellipse cx="600" cy="120" rx="85" ry="48" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.3"/>
    <text x="600" y="115" font-size="10.5" fill="#2B2318" text-anchor="middle" font-weight="600">servidor web</text>
    <text x="600" y="131" font-size="8.5" fill="#6A5F4D" text-anchor="middle">151.101.66.132:443</text>
    <text x="600" y="146" font-size="8" fill="#9C8F79" text-anchor="middle">solo ve 83.44.120.9</text>
    <!-- flechas ida -->
    <line x1="175" y1="66" x2="235" y2="100" stroke="#2F6F62" stroke-width="1.6" marker-end="url(#fnt1)"/>
    <text x="190" y="52" font-size="8" fill="#2F6F62">de .34:51234</text>
    <line x1="485" y1="100" x2="520" y2="100" stroke="#2F6F62" stroke-width="1.6" marker-end="url(#fnt1)"/>
    <text x="500" y="88" font-size="8" fill="#2F6F62" text-anchor="middle">de 83.44.120.9:51234</text>
    <!-- vuelta -->
    <line x1="520" y1="145" x2="485" y2="145" stroke="#9A6A14" stroke-width="1.6" marker-end="url(#fnt2)"/>
    <text x="500" y="162" font-size="8" fill="#9A6A14" text-anchor="middle">a 83.44.120.9:51234</text>
    <line x1="235" y1="120" x2="175" y2="88" stroke="#9A6A14" stroke-width="1.6" marker-end="url(#fnt2)"/>
    <text x="186" y="118" font-size="8" fill="#9A6A14">a .34:51234</text>
    <line x1="175" y1="222" x2="235" y2="160" stroke="#6A5F4D" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#fnt1)"/>
    <!-- intruso -->
    <line x1="560" y1="215" x2="485" y2="215" stroke="#C4342A" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#fnt2)"/>
    <text x="600" y="205" font-size="8.5" fill="#C4342A" text-anchor="middle">alguien llama al</text>
    <text x="600" y="218" font-size="8.5" fill="#C4342A" text-anchor="middle">83.44.120.9:22</text>
    <text x="600" y="234" font-size="8" fill="#6A5F4D" text-anchor="middle">sin línea en la libreta:</text>
    <text x="600" y="246" font-size="8" fill="#6A5F4D" text-anchor="middle">se descarta</text>
    <text x="350" y="295" font-size="10" fill="#6A5F4D" text-anchor="middle">una dirección pública, muchos aparatos: los puertos son lo que permite distinguir cada conversación</text>
  </g>
</svg>
