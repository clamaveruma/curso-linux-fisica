<svg viewBox="0 0 700 300" width="700" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="La red de casa: direcciones privadas dentro, una sola dirección pública fuera, el router traduce">
  <defs>
    <marker id="fnc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6A5F4D"/></marker>
  </defs>
  <g font-family="IBM Plex Mono,monospace">
    <!-- casa -->
    <rect x="20" y="30" width="400" height="240" rx="6" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="36" y="54" font-size="11.5" fill="#2B2318" font-weight="600">TU CASA · red privada 192.168.1.0/24</text>
    <rect x="40" y="80" width="110" height="44" rx="4" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.2"/>
    <text x="95" y="98" font-size="10.5" fill="#2B2318" text-anchor="middle" font-weight="600">portátil</text>
    <text x="95" y="114" font-size="9" fill="#6A5F4D" text-anchor="middle">192.168.1.34</text>
    <rect x="40" y="140" width="110" height="44" rx="4" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.2"/>
    <text x="95" y="158" font-size="10.5" fill="#2B2318" text-anchor="middle" font-weight="600">móvil</text>
    <text x="95" y="174" font-size="9" fill="#6A5F4D" text-anchor="middle">192.168.1.57</text>
    <rect x="40" y="200" width="110" height="44" rx="4" fill="#DFE9DF" stroke="#2F6F62" stroke-width="1.2"/>
    <text x="95" y="218" font-size="10.5" fill="#2B2318" text-anchor="middle" font-weight="600">tele</text>
    <text x="95" y="234" font-size="9" fill="#6A5F4D" text-anchor="middle">192.168.1.120</text>
    <!-- router -->
    <rect x="250" y="130" width="150" height="64" rx="5" fill="#F5EBD6" stroke="#9A6A14" stroke-width="1.6"/>
    <text x="325" y="152" font-size="11.5" fill="#9A6A14" text-anchor="middle" font-weight="600">ROUTER</text>
    <text x="325" y="168" font-size="9" fill="#6A5F4D" text-anchor="middle">dentro: 192.168.1.1</text>
    <text x="325" y="184" font-size="9" fill="#C4342A" text-anchor="middle">fuera: 83.44.120.9</text>
    <line x1="152" y1="102" x2="244" y2="150" stroke="#6A5F4D" stroke-width="1.4"/>
    <line x1="152" y1="162" x2="244" y2="162" stroke="#6A5F4D" stroke-width="1.4"/>
    <line x1="152" y1="222" x2="244" y2="175" stroke="#6A5F4D" stroke-width="1.4"/>
    <!-- internet -->
    <line x1="402" y1="162" x2="480" y2="162" stroke="#C4342A" stroke-width="2" marker-end="url(#fnc)"/>
    <text x="440" y="150" font-size="9.5" fill="#C4342A" text-anchor="middle" font-weight="600">NAT</text>
    <ellipse cx="590" cy="162" rx="95" ry="52" fill="#FAF6EB" stroke="#9C8F79" stroke-width="1.4"/>
    <text x="590" y="155" font-size="12" fill="#2B2318" text-anchor="middle" font-weight="600">INTERNET</text>
    <text x="590" y="173" font-size="9.5" fill="#6A5F4D" text-anchor="middle">solo ve 83.44.120.9</text>
    <text x="590" y="188" font-size="9" fill="#9C8F79" text-anchor="middle">una dirección para toda la casa</text>
    <text x="350" y="290" font-size="10" fill="#9C8F79" text-anchor="middle">el router traduce (NAT): tres aparatos salen por una sola dirección pública — y por eso desde fuera nadie entra sin invitación</text>
  </g>
</svg>
