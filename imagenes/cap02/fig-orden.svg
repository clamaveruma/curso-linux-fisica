    <rect x="15" y="15" width="300" height="260" rx="4" fill="#FAF6EB" stroke="#C4342A" stroke-width="1.3"/>
    <text x="35" y="42" font-size="12" fill="#C4342A" font-weight="600" letter-spacing="1">ANTES · el caos</text>
    <text x="35" y="70" fill="#6A5F4D">run1.csv</text>
    <text x="35" y="90" fill="#6A5F4D">Run02.csv</text>
    <text x="35" y="110" fill="#6A5F4D">RUN_3.csv</text>
    <text x="35" y="130" fill="#C4342A">run 4.csv</text>
    <text x="185" y="130" font-size="10" fill="#9C8F79">← ¡espacio!</text>
    <text x="35" y="150" fill="#6A5F4D">run5 (otra copia).csv</text>
    <text x="35" y="170" fill="#6A5F4D">medidas_run6_MALO.csv</text>
    <text x="35" y="190" fill="#6A5F4D">notas dia 1.txt</text>
    <text x="35" y="210" fill="#6A5F4D">borrame.tmp</text>
    <text x="35" y="230" fill="#6A5F4D">pendulo.csv.bak</text>
    <text x="35" y="250" fill="#9C8F79">.config_sensor</text>
    <text x="200" y="250" font-size="10" fill="#9C8F79">← oculto</text>
    <!-- flecha central -->
    <line x1="322" y1="145" x2="372" y2="145" stroke="#2F6F62" stroke-width="2" marker-end="url(#ford)"/>
    <!-- panel orden -->
    <rect x="385" y="15" width="300" height="260" rx="4" fill="#FAF6EB" stroke="#2F6F62" stroke-width="1.3"/>
    <text x="405" y="42" font-size="12" fill="#24564B" font-weight="600" letter-spacing="1">DESPUÉS · el experimento</text>
    <text x="405" y="70" fill="#2B2318" font-weight="600">experimento-pendulo/</text>
    <text x="425" y="94" fill="#2F6F62" font-weight="600">datos/</text>
    <text x="445" y="114" fill="#6A5F4D">run01.csv … run05.csv</text>
    <text x="425" y="138" fill="#2F6F62" font-weight="600">descartes/</text>
    <text x="445" y="158" fill="#6A5F4D">run06_sensor_malo.csv</text>
