<svg viewBox="0 0 700 290" width="700" height="290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="La práctica: del directorio caótico al experimento organizado">
  <defs>
    <marker id="ford" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#2F6F62"/></marker>
  </defs>
  <g font-family="IBM Plex Mono,monospace" font-size="12">
